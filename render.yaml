services:
  - type: web
    name: streamvault
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MAX_DOWNLOAD_BYTES
        value: "2147483648"
      - key: MAX_ACTIVE_JOBS
        value: "24"
      - key: JOB_TTL_SECONDS
        value: "900"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
