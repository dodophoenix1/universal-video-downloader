name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    name: Test, Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest suite
        run: pytest -v tests/

      - name: Run ruff linter
        run: ruff check .

      - name: Run bandit security analysis
        run: bandit -r main.py

      - name: Run pip-audit CVE check
        run: pip-audit

  docker-build-test:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: streamvault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container healthcheck and index
        run: |
          docker run -d --name streamvault-smoke -p 18000:8000 streamvault:ci
          trap 'docker rm -f streamvault-smoke || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health -o /tmp/health.json; then
              python3 -c 'import json; d = json.load(open("/tmp/health.json")); assert d.get("status") == "ok" and d.get("ffmpeg") is True, d'
              curl -fsS http://127.0.0.1:18000/ -o /dev/null
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs streamvault-smoke
          exit 1

  deploy-render-hook:
    name: Trigger Render Deploy Hook
    needs: [test-and-security, docker-build-test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            http_code=$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" --retry 3 --retry-delay 2 "$RENDER_DEPLOY_HOOK_URL")
            if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
              echo "::error::Render deploy hook returned HTTP $http_code"
              cat /tmp/render-deploy.json || true
              exit 1
            fi
            echo "Render deploy triggered successfully (HTTP $http_code)."
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set; skipping Render deploy hook."
          fi
